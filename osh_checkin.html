<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>تسجيل الحضور - أسرة صناع الحياة بالجامعات المصرية</title>
  <meta name="description" content="سكانر تسجيل حضور الإيفنتات - أسرة صناع الحياة بالجامعات المصرية">
  <meta name="theme-color" content="#08283f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --dys-bg-1: #08283f;
      --dys-bg-2: #0e3c5c;
      --dys-bg-3: #061c2c;
      --dys-green: #1668a0;
      --dys-green-dark: #0a4b73;
      --dys-white: #ffffff;
      --dys-text: #0d2438;
      --dys-text-muted: #5b7186;
      --dys-error: #c0392b;
      --dys-warn: #c98a0b;
      --card-radius: 24px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; overflow-x: hidden; }

    body {
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 14px 40px;
      background:
        radial-gradient(1200px 600px at 15% -10%, rgba(245, 171, 30, .10), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(60, 180, 74, .18), transparent 55%),
        linear-gradient(165deg, var(--dys-bg-2) 0%, var(--dys-bg-1) 55%, var(--dys-bg-3) 100%);
      color: var(--dys-text);
    }

    .wrap { width: 100%; max-width: 460px; }

    .brand {
      text-align: center;
      color: rgba(255,255,255,.85);
      font-weight: 700;
      margin-bottom: 14px;
      font-size: 14px;
      letter-spacing: .3px;
    }

    .card {
      background: var(--dys-white);
      border-radius: var(--card-radius);
      padding: 22px 20px 26px;
      box-shadow: 0 30px 80px rgba(0,0,0,.4);
    }

    h1 { font-size: 20px; margin: 0 0 4px; text-align: center; }
    .sub { text-align: center; color: var(--dys-text-muted); font-size: 13px; margin-bottom: 18px; }

    /* ---------- login ---------- */
    #loginScreen input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1.5px solid #dfe6e0;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 12px;
    }
    #loginScreen input:focus { outline: none; border-color: var(--dys-green); }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--dys-green);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform .15s var(--ease), background .15s;
    }
    .btn:hover { background: var(--dys-green-dark); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn-outline {
      background: transparent;
      color: var(--dys-text);
      border: 1.5px solid #dfe6e0;
    }
    .btn-outline:hover { background: #f5f7f5; }
    .err-note { color: var(--dys-error); font-size: 13px; margin-top: 10px; text-align: center; display: none; }

    /* ---------- scanner screen ---------- */
    #scanScreen { display: none; }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .session-count {
      background: #eef8ef;
      color: var(--dys-green-dark);
      font-weight: 800;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
    }
    .logout-link {
      font-size: 13px;
      color: var(--dys-text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .cam-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #061c2c;
      border-radius: 18px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    #video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cam-frame {
      position: absolute; inset: 12%;
      border: 3px solid rgba(255,255,255,.55);
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 0 0 999px rgba(0,0,0,.28);
    }
    .cam-hint {
      position: absolute; bottom: 10px; left: 0; right: 0;
      text-align: center; color: rgba(255,255,255,.85); font-size: 12px;
    }
    .cam-off {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.7); font-size: 13px; text-align: center; padding: 20px;
    }

    .manual-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .manual-row input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1.5px solid #dfe6e0;
      font-family: inherit;
      font-size: 14px;
      text-align: center;
      letter-spacing: .5px;
    }
    .manual-row input:focus { outline: none; border-color: var(--dys-green); }
    .manual-row button {
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: var(--dys-text);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .mode-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      color: var(--dys-text-muted);
      margin-bottom: 14px;
      user-select: none;
    }
    .mode-toggle input { cursor: pointer; }

    /* ---------- result card ---------- */
    #result { display: none; border-radius: 16px; padding: 16px; margin-top: 4px; }
    #result.ok { background: #eef8ef; border: 1.5px solid #bfe6c4; }
    #result.already { background: #fff8e6; border: 1.5px solid #f0dca0; }
    #result.bad { background: #fdecea; border: 1.5px solid #f3c2bd; }
    #result.info { background: #eef3fb; border: 1.5px solid #c6d7f2; }

    .result-top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .result-icon { font-size: 30px; line-height: 1; }
    .result-name { font-size: 17px; font-weight: 800; }
    .result-meta { font-size: 13px; color: var(--dys-text-muted); }
    .result-status { font-size: 13px; font-weight: 700; margin-top: 6px; }
    #result.ok .result-status { color: var(--dys-green-dark); }
    #result.already .result-status { color: var(--dys-warn); }
    #result.bad .result-status { color: var(--dys-error); }

    .foot {
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      margin-top: 16px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="brand">أسرة صناع الحياة · OSAR SONAA AL-HAYAH — تسجيل حضور</div>

    <div class="card">
      <!-- ============ Login ============ -->
      <div id="loginScreen">
        <h1>تسجيل الدخول</h1>
        <div class="sub">استخدم نفس كلمة سر لوحة التحكم</div>
        <input type="password" id="passwordInput" placeholder="كلمة السر" autocomplete="current-password">
        <button type="button" class="btn" id="loginBtn">دخول</button>
        <div class="err-note" id="loginErr"></div>
      </div>

      <!-- ============ Scanner ============ -->
      <div id="scanScreen">
        <div class="top-row">
          <span class="session-count" id="sessionCount">تم تسجيل 0 من بداية الجلسة</span>
          <span class="logout-link" id="logoutBtn">خروج</span>
        </div>

        <div class="cam-wrap">
          <video id="video" playsinline muted></video>
          <div class="cam-frame"></div>
          <div class="cam-hint">وجّه الكاميرا على QR كود الشهادة</div>
          <div class="cam-off" id="camOff" style="display:none;"></div>
        </div>

        <div class="manual-row">
          <input type="text" id="manualCode" placeholder="أو اكتب رقم العضوية يدويًا (OSH-000123)">
          <button type="button" id="manualBtn">تحقق</button>
        </div>

        <label class="mode-toggle">
          <input type="checkbox" id="verifyOnlyToggle">
          🔍 تحقق بس من غير ما أسجّل حضور (للمراجعة عند البوابة)
        </label>

        <div id="result">
          <div class="result-top">
            <span class="result-icon" id="resultIcon"></span>
            <div>
              <div class="result-name" id="resultName"></div>
              <div class="result-meta" id="resultMeta"></div>
            </div>
          </div>
          <div class="result-status" id="resultStatus"></div>
        </div>
      </div>
    </div>

    <div class="foot">لو مفيش كاميرا أو الإذن اتمنع، استخدم خانة الكتابة اليدوية تحت المربع.</div>
  </div>

  <script src="jsQR.js"></script>
  <script>
    // Same backend as the registration form / dashboard — nothing new to
    // deploy, just point this at the same Apps Script Web App URL.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCc8DQOMXJeL_DmH6xf1f_UBL-7Qfef8yiyLdY-x8Dnsa6EDBJASMKk6shoLtOieHn/exec";
    const PWD_KEY = "dys_checkin_password";
    // Optional ?form=xxx — restricts scans to that specific form's
    // registrants (e.g. dys_checkin.html?form=f_a1b2c3d4 for an event's own
    // door). Missing/empty = search across every form's data, same as
    // before multi-form support existed.
    const DYS_FORM_ID = new URLSearchParams(window.location.search).get("form") || "";

    const loginScreen = document.getElementById("loginScreen");
    const scanScreen = document.getElementById("scanScreen");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const loginErr = document.getElementById("loginErr");
    const sessionCountEl = document.getElementById("sessionCount");
    const logoutBtn = document.getElementById("logoutBtn");
    const video = document.getElementById("video");
    const camOff = document.getElementById("camOff");
    const manualCode = document.getElementById("manualCode");
    const manualBtn = document.getElementById("manualBtn");
    const verifyOnlyToggle = document.getElementById("verifyOnlyToggle");
    const result = document.getElementById("result");
    const resultIcon = document.getElementById("resultIcon");
    const resultName = document.getElementById("resultName");
    const resultMeta = document.getElementById("resultMeta");
    const resultStatus = document.getElementById("resultStatus");

    let password = "";
    let sessionCheckins = 0;
    let scanning = false;
    let lastCode = "";
    let lastCodeAt = 0;
    let canvas, ctx, rafId;

    // ==================== Audio + haptic feedback ====================
    // في يوم زحمة، اللي بيسكان مش هيقدر يبص في الشاشة كل ثانية — فبنفرّق
    // بالصوت بس. AudioContext واحد بيتعمل مرة، ومتصفحات الموبايل بتمنع
    // تشغيل صوت قبل أول لمسة/كليك على الصفحة، فبنفتحه عند أول تفاعل.
    let audioCtx = null;
    function getAudioCtx_() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
      return audioCtx;
    }
    ["click", "touchstart"].forEach(evt => {
      document.addEventListener(evt, () => { getAudioCtx_(); }, { once: true, passive: true });
    });

    function beep_(freq, durationMs, type, delayMs, volume) {
      const ctx2 = getAudioCtx_();
      if (!ctx2) return;
      const startAt = ctx2.currentTime + (delayMs || 0) / 1000;
      const osc = ctx2.createOscillator();
      const gain = ctx2.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, startAt);
      gain.gain.linearRampToValueAtTime(volume || 0.25, startAt + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, startAt + durationMs / 1000);
      osc.connect(gain);
      gain.connect(ctx2.destination);
      osc.start(startAt);
      osc.stop(startAt + durationMs / 1000 + 0.02);
    }

    // نغمة مختلفة لكل نتيجة عشان تتفرق من غير ما تبص للشاشة:
    //  - ok (حضور جديد):        بيبتين صاعدين واضحين + اهتزازة قصيرة
    //  - already (مسجّل قبل كده): نغمة واحدة متوسطة (تنبيه مش خطأ)
    //  - bad (كود غلط/مشكلة):    بزّة منخفضة خشنة + اهتزاز متقطع طويل
    //  - info (تحقق بس/تحميل):   من غير صوت عشان منزعجش المستخدم كل شوية
    function playFeedback_(cls) {
      try {
        if (cls === "ok") {
          beep_(880, 90, "sine", 0, 0.28);
          beep_(1320, 120, "sine", 110, 0.28);
          if (navigator.vibrate) navigator.vibrate(80);
        } else if (cls === "already") {
          beep_(600, 170, "sine", 0, 0.24);
          if (navigator.vibrate) navigator.vibrate([60, 60, 60]);
        } else if (cls === "bad") {
          beep_(190, 220, "square", 0, 0.2);
          beep_(190, 220, "square", 260, 0.2);
          if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
        }
      } catch (e) {
        // الصوت/الاهتزاز مش أساسي لعمل الصفحة — أي خطأ هنا يتجاهل.
      }
    }

    function showResult(cls, icon, name, meta, status) {
      result.className = cls;
      result.style.display = "block";
      resultIcon.textContent = icon;
      resultName.textContent = name;
      resultMeta.textContent = meta;
      resultStatus.textContent = status;
      playFeedback_(cls);
    }

    function fmtTime(iso) {
      try { return new Date(iso).toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }); }
      catch (e) { return ""; }
    }

    // ==================== Login ====================
    function attemptLogin(pwd) {
      loginErr.style.display = "none";
      loginBtn.disabled = true;
      loginBtn.textContent = "جاري التحقق...";
      // Piggy-backs on verifyMember: it checks the password FIRST, so a
      // deliberately empty/junk code either fails with "Unauthorized" (bad
      // password) or with some other message (password is fine) — no need
      // for a separate dedicated login endpoint.
      fetch(`${SCRIPT_URL}?action=verifyMember&password=${encodeURIComponent(pwd)}&code=__ping__`, { cache: "no-store" })
        .then(r => r.json())
        .then(res => {
          loginBtn.disabled = false;
          loginBtn.textContent = "دخول";
          if (res.status === "error" && res.message === "Unauthorized") {
            loginErr.textContent = "كلمة السر غلط";
            loginErr.style.display = "block";
            return;
          }
          password = pwd;
          localStorage.setItem(PWD_KEY, pwd);
          loginScreen.style.display = "none";
          scanScreen.style.display = "block";
          startCamera_();
        })
        .catch(() => {
          loginBtn.disabled = false;
          loginBtn.textContent = "دخول";
          loginErr.textContent = "تعذر الاتصال — تأكد من الإنترنت";
          loginErr.style.display = "block";
        });
    }

    loginBtn.addEventListener("click", () => {
      const pwd = passwordInput.value.trim();
      if (!pwd) return;
      attemptLogin(pwd);
    });
    passwordInput.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem(PWD_KEY);
      password = "";
      stopCamera_();
      scanScreen.style.display = "none";
      loginScreen.style.display = "block";
      passwordInput.value = "";
      passwordInput.focus();
    });

    // ==================== Camera pre-warm ====================
    // أكبر مصدر للتأخير مش سرعة الكاميرا نفسها — إنها كانت بتتطلب بعد ما
    // اليوزر يدخل باسورد (يعني بعد ما طلب الشبكة بتاع تسجيل الدخول يخلص
    // كمان). بنطلب إذن الكاميرا من أول ما الصفحة تفتح، عشان الجهاز ياخد
    // وقته وهو لسه بيكتب الباسورد، فيوصل شاشة السكان والكاميرا جاهزة
    // فورًا أو شبه فورًا.
    let cameraStreamPromise = null;
    function preloadCamera_() {
      if (cameraStreamPromise) return cameraStreamPromise;
      if (typeof jsQR === "undefined") return null;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return null;
      cameraStreamPromise = navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          // قللنا الدقة المطلوبة من 1280x720 لـ 960x540 — التفاوض على
          // دقة أعلى مع هاردوير الكاميرا هو غالبًا سبب البطء، والدقة دي
          // لسه كفاية لقراءة QR من مسافة عادية.
          width: { ideal: 960 },
          height: { ideal: 540 },
        },
      });
      // لو الطلب فشل (رفض إذن مثلاً)، منسيبش الوعد الفاشل متسجّل —
      // startCamera_ هتحاول تاني وتظهر رسالة الخطأ الصح وقتها.
      cameraStreamPromise.catch(() => { cameraStreamPromise = null; });
      return cameraStreamPromise;
    }
    preloadCamera_();

    // ==================== Camera + QR decode loop ====================
    function startCamera_() {
      if (typeof jsQR === "undefined") {
        camOff.style.display = "flex";
        camOff.textContent = "مكتبة قراءة الـ QR ماتحمّلتش (مشكلة في النت) — رفرش الصفحة أو استخدم الكتابة اليدوية تحت.";
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        camOff.style.display = "flex";
        camOff.textContent = "المتصفح ده مش بيدعم الكاميرا — استخدم الكتابة اليدوية تحت.";
        return;
      }
      camOff.style.display = "flex";
      camOff.textContent = "بيتم تشغيل الكاميرا...";

      // بنستخدم الستريم اللي اتجهّز مقدمًا لو موجود؛ لو مش موجود (فشل
      // preload لأي سبب)، بنطلبه دلوقتي كـ fallback زي الأول بالظبط.
      const streamPromise = preloadCamera_() || navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 960 },
          height: { ideal: 540 },
        },
      });

      streamPromise
        .then(stream => {
          video.srcObject = stream;
          video.play();
          canvas = document.createElement("canvas");
          ctx = canvas.getContext("2d", { willReadFrequently: true });
          scanning = true;
          rafId = requestAnimationFrame(scanLoop_);

          // Hide the "starting camera..." message as soon as a real frame
          // is available, instead of leaving it up for the full duration
          // of the camera's hardware/auto-exposure warm-up.
          video.addEventListener("loadeddata", () => {
            camOff.style.display = "none";
          }, { once: true });

          // Many Android rear cameras default to a fixed or slow focus via
          // getUserMedia and never sharpen up at the close range a QR code
          // is normally held at — the video looks "fine" but every frame is
          // just soft enough that jsQR can't lock onto it. Ask for
          // continuous autofocus when the device exposes that capability.
          const track = stream.getVideoTracks()[0];
          if (track && track.getCapabilities) {
            try {
              const caps = track.getCapabilities();
              if (caps.focusMode && caps.focusMode.includes("continuous")) {
                track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }).catch(() => {});
              }
            } catch (e) {
              // getCapabilities/applyConstraints not supported on this browser — ignore.
            }
          }
        })
        .catch(() => {
          camOff.style.display = "flex";
          camOff.textContent = "الكاميرا محتاجة إذن — لو رفضته، استخدم الكتابة اليدوية تحت.";
        });
    }

    function stopCamera_() {
      scanning = false;
      if (rafId) cancelAnimationFrame(rafId);
      const stream = video.srcObject;
      if (stream) stream.getTracks().forEach(t => t.stop());
      video.srcObject = null;
      // الستريم اللي كان متجهّز مقدمًا بقى متوقف دلوقتي (تراكاته اتقفلت) —
      // لازم نمسحه ونجهّز واحد جديد عشان يكون جاهز لو اليوزر سجّل دخول
      // تاني بعد الخروج.
      cameraStreamPromise = null;
      preloadCamera_();
    }

    // Ignore re-scanning the exact same code within a few seconds — someone
    // holding their QR steady in frame shouldn't spam ten submissions.
    const RESCAN_COOLDOWN_MS = 4000;

    // jsQR itself, and getImageData on some devices, can throw on an odd
    // frame (e.g. camera resizing mid-frame, or jsQR's own known edge-case
    // throws on certain pixel patterns). Without a try/catch here, ONE bad
    // frame throws out of scanLoop_ *before* it reaches the
    // requestAnimationFrame(scanLoop_) call at the bottom — so the loop
    // never reschedules itself. The video keeps playing (camera looks
    // "on"), but nothing is ever decoded again. That's the "مش بيلقط"
    // symptom. Catching here guarantees the loop always reschedules.
    function scanLoop_() {
      if (!scanning) return;
      try {
        if (video.readyState === video.HAVE_ENOUGH_DATA && video.videoWidth > 0) {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const qr = jsQR(imageData.data, imageData.width, imageData.height, {
            inversionAttempts: "attemptBoth",
          });
          if (qr && qr.data) {
            const now = Date.now();
            if (qr.data !== lastCode || now - lastCodeAt > RESCAN_COOLDOWN_MS) {
              lastCode = qr.data;
              lastCodeAt = now;
              handleCode_(qr.data);
            }
          }
        }
      } catch (err) {
        // Log it, but never let a single bad frame kill scanning permanently.
        console.error("scanLoop_ frame error:", err);
      }
      rafId = requestAnimationFrame(scanLoop_);
    }

    // ==================== Manual entry ====================
    manualBtn.addEventListener("click", () => {
      const v = manualCode.value.trim();
      if (!v) return;
      handleCode_(v);
      manualCode.value = "";
    });
    manualCode.addEventListener("keydown", e => { if (e.key === "Enter") manualBtn.click(); });

    // ==================== Submit (scan or manual) ====================
    function handleCode_(rawCode) {
      showResult("info", "⏳", "جاري التحقق...", "", "");
      const verifyOnly = verifyOnlyToggle.checked;
      const action = verifyOnly ? "verifyMember" : "checkin";

      const request = verifyOnly
        ? fetch(`${SCRIPT_URL}?action=verifyMember&password=${encodeURIComponent(password)}&code=${encodeURIComponent(rawCode)}&form=${encodeURIComponent(DYS_FORM_ID)}`, { cache: "no-store" }).then(r => r.json())
        : fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight, same trick the registration form uses
            body: JSON.stringify({ action: "checkin", password, code: rawCode, formId: DYS_FORM_ID }),
          }).then(r => r.json());

      request.then(res => {
        if (res.status === "error" && res.message === "Unauthorized") {
          showResult("bad", "🔒", "الجلسة انتهت", "", "كلمة السر بقت مش صحيحة — اعمل خروج ودخول تاني");
          return;
        }
        if (res.status === "not_found") {
          showResult("bad", "❌", "مش لاقيين الكود ده", rawCode, "اتأكد من الكود أو اسأل الأدمن");
          return;
        }
        if (res.status === "error") {
          showResult("bad", "⚠️", "حصل خطأ", "", res.message || "جرب تاني");
          return;
        }
        const m = res.member || {};
        const meta = [m.role, m.faculty, m.membershipNo].filter(Boolean).join(" · ");

        if (verifyOnly) {
          const already = !!res.checkedInAt;
          showResult(already ? "already" : "info", already ? "✅" : "ℹ️", m.name || "—", meta,
            already ? `اتسجل حضوره الساعة ${fmtTime(res.checkedInAt)}` : "لسه ماسجّلش حضور — دا تحقق بس، من غير تسجيل");
          return;
        }

        if (res.status === "already") {
          showResult("already", "⚠️", m.name || "—", meta, `مسجّل حضور بالفعل من الساعة ${fmtTime(res.checkedInAt)}`);
          return;
        }

        // status === "success" — brand new check-in
        sessionCheckins += 1;
        sessionCountEl.textContent = `تم تسجيل ${sessionCheckins} من بداية الجلسة`;
        showResult("ok", "✅", m.name || "—", meta, `اتسجل الحضور الساعة ${fmtTime(res.checkedInAt)}`);
      }).catch(() => {
        showResult("bad", "📡", "تعذر الاتصال", "", "اتأكد من الإنترنت وجرب تاني");
      });
    }

    // ==================== Boot ====================
    const savedPwd = localStorage.getItem(PWD_KEY);
    if (savedPwd) {
      attemptLogin(savedPwd);
    }
  </script>
</body>

</html>
